<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RiskRadarPlatform | Jira Control Center</title>
    <style>
        :root {
            --bg: #0b1020;
            --sidebar: #111827;
            --card: #ffffff;
            --muted: #6b7280;
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
            --info: #0ea5e9;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fafc 40%, #edf6ff);
            color: #111827;
        }
        .layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: var(--sidebar);
            color: #f9fafb;
            padding: 24px 18px;
        }
        .brand {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .nav a {
            display: block;
            text-decoration: none;
            color: #e5e7eb;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .nav a:hover { background: rgba(37,99,235,0.2); }
        .main {
            flex: 1;
            padding: 28px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 14px;
        }
        .hero {
            border-radius: 18px;
            padding: 24px;
            background: linear-gradient(135deg, #11203e, #1e3a8a 55%, #2563eb);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            box-shadow: 0 15px 30px rgba(37,99,235,0.2);
        }
        .hero h1 { margin: 0; font-size: 2.1rem; }
        .hero p { margin: 8px 0 0; opacity: 0.9; }
        .hero img {
            width: 180px;
            height: 120px;
            border-radius: 14px;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.4);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-top: 22px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 5px 14px rgba(15,23,42,0.05);
        }
        .metric-title { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
        .metric-value { font-size: 2rem; font-weight: bold; margin-top: 8px; }
        .pill {
            display: inline-block;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: bold;
            color: white;
        }
        .green { background: var(--success); }
        .yellow { background: var(--warning); }
        .orange { background: #f97316; }
        .red { background: var(--danger); }
        .blue { background: var(--info); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.95rem;
        }
        th, td {
            border-bottom: 1px solid var(--border);
            padding: 12px 10px;
            text-align: left;
            vertical-align: middle;
        }
        th { background: #f8fafc; }
        .section {
            margin-top: 28px;
        }
        .section h2 {
            margin-bottom: 12px;
            font-size: 1.4rem;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
        }
        .status-todo { background: #64748b; }
        .status-progress { background: #2563eb; }
        .status-done { background: #16a34a; }
        .status-blocked { background: #dc2626; }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">RiskRadar</div>
            <nav class="nav">
                <a href="#overview">Overview</a>
                <a href="#sprint-health">Sprint Health</a>
                <a href="#capacity">Resource Capacity</a>
                <a href="#risk-dashboard">Risk Dashboard</a>
                <a href="#backlog">Backlog Prioritization</a>
            </nav>
        </aside>

        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
