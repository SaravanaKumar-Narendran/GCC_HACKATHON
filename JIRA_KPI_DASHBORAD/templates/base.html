<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Jira KPI Dashboard</title>
    <style>
        :root {
            --bg: #081120;
            --panel: rgba(15, 23, 42, 0.92);
            --card: #ffffff;
            --soft: #f1f5f9;
            --muted: #64748b;
            --primary: #2563eb;
            --green: #16a34a;
            --amber: #f59e0b;
            --orange: #f97316;
            --red: #dc2626;
            --shadow: 0 18px 45px rgba(15, 23, 42, 0.15);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #eff6ff 30%, #f8fafc 100%);
            color: #0f172a;
        }
        .shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            background: linear-gradient(135deg, #0f172a, #111827 45%, #1d4ed8);
            color: white;
            padding: 22px 28px;
            box-shadow: var(--shadow);
        }
        .topbar-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .brand {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .subtle {
            font-size: 0.88rem;
            opacity: 0.8;
        }
        .nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav a {
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
        }
        .container {
            max-width: 1400px;
            margin: 24px auto;
            padding: 0 20px 30px;
        }
        .hero {
            background: linear-gradient(135deg, #0f172a, #1d4ed8 52%, #3b82f6);
            color: white;
            padding: 28px;
            border-radius: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: var(--shadow);
        }
        .hero h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 3rem);
        }
        .hero p {
            margin: 10px 0 0;
            font-size: 1rem;
            opacity: 0.9;
        }
        .hero-mark {
            width: 170px;
            height: 120px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,255,255,0.26), rgba(255,255,255,0.08));
            display: grid;
            place-items: center;
            font-size: 3rem;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(15,23,42,0.06);
        }
        .filter-bar {
            display: flex;
            align-items: end;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 22px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 260px;
        }
        .field label {
            color: var(--muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
        }
        .field select,
        .field button,
        .field input {
            border: 1px solid rgba(148,163,184,0.45);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.96rem;
        }
        .field button {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-top: 24px;
        }
        .metric-title {
            color: var(--muted);
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
        }
        .metric-value {
            margin-top: 12px;
            font-weight: 800;
            font-size: clamp(1.7rem, 2vw, 2.4rem);
        }
        .status-badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: white;
        }
        .status-low { background: var(--green); }
        .status-medium { background: var(--amber); }
        .status-high { background: var(--orange); }
        .status-critical { background: var(--red); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        th, td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(148,163,184,0.25);
            vertical-align: middle;
        }
        th {
            background: #f8fafc;
            color: #0f172a;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .issue-link {
            text-decoration: none;
            color: #1d4ed8;
            font-weight: 700;
        }
        .report-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        .report-links a {
            text-decoration: none;
            color: #0f172a;
            background: #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
        }
        .muted {
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="topbar-inner">
                <div>
                    <div class="brand">Business Jira KPI Command Center</div>
                    <div class="subtle">Portfolio-level risk and delivery insights</div>
                </div>
                <nav class="nav">
                    <a href="/">Overview</a>
                    <a href="/report/summary">Summary</a>
                    <a href="/report/flow-and-velocity">Flow &amp; Velocity</a>
                    <a href="/report/quality-and-stability">Quality &amp; Stability</a>
                    <a href="/report/predictability-and-dependency">Predictability &amp; Dependency</a>
                </nav>
            </div>
        </header>
        <main class="container">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
