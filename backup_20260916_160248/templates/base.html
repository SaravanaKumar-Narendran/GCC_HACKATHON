<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Metrics Report{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 80px;
        }
        .header {
            background: #0f172a;
            color: white;
            padding: 18px 24px;
            border-radius: 12px;
            margin-bottom: 22px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin: 24px 0;
        }
        .card {
            background: white;
            border: 1px solid #dfe6f1;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
        }
        .traffic-light {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
            border: 2px solid rgba(0,0,0,0.15);
        }
        .green { background: #22c55e; }
        .yellow { background: #facc15; }
        .red { background: #ef4444; }
        .footer-jql {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: #111827;
            color: #e5e7eb;
            border-top: 2px solid #374151;
            padding: 12px 20px;
            font-size: 14px;
            word-break: break-word;
        }
        .jql-label {
            font-weight: bold;
            color: #f8fafc;
        }
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .chart-box {
            background: white;
            border-radius: 12px;
            border: 1px solid #dfe6f1;
            padding: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Project Metrics Dashboard</h1>
        </div>

        {% block content %}{% endblock %}
    </div>

    <div class="footer-jql">
        <span class="jql-label">JQL Reference:</span>
        <span>{{ jql_query }}</span>
    </div>
</body>
</html>
